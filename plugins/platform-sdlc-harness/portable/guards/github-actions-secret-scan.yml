# platform-sdlc-harness — portable data-policy CI guard (GitHub Actions).
#
# A backstop for the pre-commit hook (which can be bypassed with --no-verify): fails the
# workflow if a push or PR introduces secret-key shapes or sensitive file paths. Mirrors the
# plugin's hooks/secret-scan-guard.sh / sensitive-file-guard.sh patterns for the providers
# the product integrates with: Paystack/Stripe, SendGrid, Firebase, Sentry, OpenAI, cloud storage.
#
# Install: copy to the target repo's .github/workflows/secret-scan.yml (scaffolded by
# /init-workspace Step 7). Runs on every pull_request and on pushes to the long-lived branches.

name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'features/**'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for provider secrets and sensitive files
        shell: bash
        run: |
          set -euo pipefail

          # Resolve the diff range. PRs diff base..head; pushes diff before..after
          # (falling back to the first commit on a new branch).
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi

          echo "Scanning diff $base..$head"

          # --- 1) Sensitive PATHS ----------------------------------------------
          paths=$(git diff --name-only --diff-filter=AM "$base" "$head" | tr '\\' '/')
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.env|*.env.*|*.secret|*.key|*.pfx|*.pem|*serviceAccount*.json|*appsettings.Production.json|*appsettings.Local.json)
                echo "::error file=$f::sensitive file must not be committed"
                exit 1
                ;;
            esac
          done <<< "$paths"

          # --- 2) Sensitive CONTENT (provider key shapes) ----------------------
          added=$(git diff --no-color -U0 "$base" "$head" | grep -E '^\+[^+]' | sed 's/^+//' || true)
          [ -z "$added" ] && { echo "data-policy scan passed (no additions)."; exit 0; }

          for entry in \
            'sk_(live|test)_[A-Za-z0-9]{24,}|Paystack/Stripe secret key' \
            'pk_(live|test)_[A-Za-z0-9]{24,}|Paystack/Stripe public key' \
            'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}|SendGrid API key' \
            'AIza[0-9A-Za-z_-]{35}|Firebase / Google API key' \
            '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----|Private key (service account or SSH)' \
            'https://[a-f0-9]{32}@[a-z0-9.-]+\.ingest\.sentry\.io/[0-9]+|Sentry DSN with secret' \
            'sk-(proj-)?[A-Za-z0-9_-]{32,}|OpenAI API key' \
            'AccountKey=[A-Za-z0-9+/=]{60,}|Cloud storage account key in connection string' \
            '[?&]sig=[A-Za-z0-9%+/=]{40,}|Cloud storage SAS signature' \
            'ey[A-Za-z0-9_-]{20,}\.ey[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|JWT-shaped token' \
            '(password|passwd|pwd|secret|api[_-]?key|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{12,}|Credential assignment with a literal value'; do

            pat="${entry%%|*}"; label="${entry#*|}"
            if printf '%s' "$added" | grep -qiE "$pat"; then
              echo "::error::Detected $label in diff (pattern: $pat)"
              exit 1
            fi
          done

          echo "data-policy scan passed."
