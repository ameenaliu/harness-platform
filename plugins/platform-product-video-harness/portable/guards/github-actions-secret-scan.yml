# platform-product-video-harness — portable data-policy CI guard (GitHub Actions).
#
# Backstop for the pre-commit hook (which can be bypassed with --no-verify):
# fails the workflow if a push or PR diff introduces secret-key shapes,
# sensitive file paths, or files >10MB. Mirrors the plugin's secrets-guard.sh +
# large-media-guard.sh, retuned for a GitHub-backed ProductVideos repo.
#
# Drop this at `.github/workflows/secret-scan.yml` in the ProductVideos repo.

name: data-policy-secret-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  MAX_BYTES: 10485760    # 10 MB

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan diff for provider secrets, sensitive files, and large media
        shell: bash
        run: |
          set -euo pipefail

          # Resolve the diff range: PR → base..head; push → before..after (fallback to first commit).
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${GITHUB_BASE_REF}"
            git fetch --no-tags --quiet origin "$base" || true
            base=$(git merge-base "origin/$base" HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          else
            base="${GITHUB_EVENT_BEFORE:-}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null \
               || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-list --max-parents=0 HEAD | tail -1)
            fi
          fi
          head=$(git rev-parse HEAD)

          echo "Scanning diff $base..$head"

          # --- 1) Sensitive PATHS --------------------------------------------------
          paths=$(git diff --name-only --diff-filter=AM "$base" "$head" | tr '\\' '/')
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            bn=$(basename "$f" | tr '[:upper:]' '[:lower:]')
            if [[ "$bn" =~ ^\.env(\..+)?$ ]] && [ "$bn" != ".env.example" ]; then
              echo "::error file=$f::.env files must never be committed"
              exit 1
            fi
            case "$bn" in
              *.secret|*.key|*.pfx|*.pem)
                echo "::error file=$f::sensitive file (key/secret/cert)"
                exit 1 ;;
              serviceaccount*.json)
                echo "::error file=$f::service-account JSON contains private key"
                exit 1 ;;
            esac
          done <<< "$paths"

          # --- 2) Large media files staged -----------------------------------------
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              sz=$(wc -c < "$f" 2>/dev/null || echo 0)
              if [ "$sz" -gt "$MAX_BYTES" ]; then
                mb=$((sz / 1024 / 1024))
                echo "::error file=$f::file size ${mb}MB exceeds 10MB cap (move to out/ or external blob store)"
                exit 1
              fi
            fi
          done <<< "$paths"

          # --- 3) Sensitive CONTENT (API key shapes) -------------------------------
          added=$(git diff --no-color -U0 "$base" "$head" | grep -E '^\+[^+]' | sed 's/^+//' || true)
          [ -z "$added" ] && { echo "data-policy scan passed (no additions)."; exit 0; }

          for entry in \
            'sk_[a-fA-F0-9]{40,}|ElevenLabs API key shape' \
            'nl-[A-Za-z0-9_-]{20,}|9jaLingo API key shape' \
            'figd_[A-Za-z0-9_-]{30,}|Figma personal access token' \
            '\bAIza[0-9A-Za-z_-]{35}\b|Firebase / Google API key' \
            'xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+|Slack bot token' \
            'ey[A-Za-z0-9_-]{20,}\.ey[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|JWT-shaped token' \
            '(password|passwd|pwd|secret|api[_-]?key|client[_-]?secret)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{16,}|Credential assignment with literal value'; do

            pat="${entry%%|*}"; label="${entry#*|}"
            if printf '%s' "$added" | grep -qiE "$pat"; then
              echo "::error::Detected $label in diff (pattern: $pat)"
              exit 1
            fi
          done

          echo "data-policy scan passed."
